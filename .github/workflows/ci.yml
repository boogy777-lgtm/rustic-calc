name: Windows CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_editions:
        description: Build and test all three Windows editions without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 / Rust and installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show
      - name: Format and module constraints
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_project.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:BUILD_REF.StartsWith('refs/tags/')) {
            python tools/check_project.py --tag $env:BUILD_TAG
          }
      - name: Regression tests
        run: cargo test --locked
      - name: Portable build
        shell: powershell
        run: ./scripts/Build-Portable.ps1
      - name: Isolated CMD integration tests
        shell: powershell
        run: ./scripts/Test-CalcCommand.ps1
      - name: Render all modes
        shell: powershell
        run: ./scripts/Smoke-Test.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/calc1.exe
      - name: Coordinate native control smoke test
        run: python tools/smoke_coordinates.py target/x86_64-pc-windows-msvc/release/calc1.exe
      - name: Installer compiler
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is unavailable.' }
          (Get-Item -LiteralPath $compiler).VersionInfo | Format-List ProductVersion
      - name: Build installer and checksums
        shell: powershell
        run: ./scripts/Build-Release.ps1
      - name: Packaging contract checks
        shell: powershell
        run: ./scripts/Test-Packaging.ps1
      - name: Disposable installer smoke test
        shell: powershell
        run: ./scripts/Test-Installer.ps1 -VerifyLaunch
      - name: Release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-release
          path: |
            dist/RusticCalc.exe
            dist/RusticCalc-Setup.exe
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          if-no-files-found: error
      - name: UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ui-evidence
          path: artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14

  editions:
    name: Windows x64 / Three editions
    if: (github.event_name == 'workflow_dispatch' && inputs.build_editions) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Inno Setup and artifact directory
        shell: powershell
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is unavailable.' }
          ./scripts/Build-Editions.ps1 -CompilerPath $compiler -OutputDirectory dist/editions
      - name: Verify release notice and packaging contracts
        shell: powershell
        run: ./scripts/Test-Packaging.ps1 -IncludeEditions
      - name: Side-by-side install and uninstall
        shell: powershell
        run: ./scripts/Test-Installer.ps1 -EditionsDirectory dist/editions -VerifyLaunch
      - name: Verify all six release executables
        shell: powershell
        run: ./scripts/Verify-EditionArtifacts.ps1 -Directory dist/editions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-editions
          path: |
            dist/editions/*.exe
            dist/editions/SHA256SUMS-Editions.txt
            dist/editions/RELEASE_NOTES*.md
            dist/editions/THIRD-PARTY-NOTICES-Win32.txt
            dist/editions/THIRD-PARTY-NOTICES-Slint.txt
            dist/editions/THIRD-PARTY-NOTICES-GPUI.txt
          if-no-files-found: error

  release:
    name: Publish immutable GitHub release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [windows, editions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-editions
          path: dist
      - name: Publish the three portables and installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS-Editions.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists. Refusing to overwrite immutable assets.' >&2
            exit 1
          fi
          cat RELEASE_NOTES.md RELEASE_NOTES-Slint.md RELEASE_NOTES-GPUI.md > release-notes.md
          gh release create "$RELEASE_TAG" \
            RusticCalc.exe RusticCalc-Setup.exe \
            RusticCalc-Slint.exe RusticCalc-Slint-Setup.exe \
            RusticCalc-GPUI.exe RusticCalc-GPUI-Setup.exe \
            SHA256SUMS-Editions.txt \
            THIRD-PARTY-NOTICES-Win32.txt THIRD-PARTY-NOTICES-Slint.txt THIRD-PARTY-NOTICES-GPUI.txt \
            --verify-tag --title "Rustic Calc $RELEASE_TAG" \
            --notes-file release-notes.md --latest
