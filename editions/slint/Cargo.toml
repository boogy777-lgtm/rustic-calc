[package]
name = "rustic-calc-slint"
version = "0.5.0"
edition = "2021"
description = "Rustic Calc Slint edition"
license = "MIT"
repository = "https://github.com/boogy777-lgtm/rustic-calc"
publish = false

[[bin]]
name = "calc1"
path = "src/main.rs"

[dependencies]
rustic-calc-app = { path = "../../crates/calc-app" }
slint = { version = "=1.18.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-18",
    "renderer-femtovg",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
